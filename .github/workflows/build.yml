name: Build CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout theos/theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout theos/sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS14.5.sdk
          path: theos/sdks

      - name: Build Package
        run: |
          brew install make xz ldid
          export THEOS="$PWD/theos"
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          # rootless（Dopamine / palera1n 主流越狱）
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p dist
          cp packages/*.deb dist/carsplit-rootless.deb
          # rootful
          gmake clean package FINALPACKAGE=1
          cp packages/*.deb dist/carsplit-rootful.deb
          ls -la dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsplit-debs
          path: dist/*.deb

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
