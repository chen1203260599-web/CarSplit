name: Build CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout theos/theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout theos/sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS14.5.sdk
          path: theos/sdks

      - name: Build Package
        run: |
          brew install make xz ldid
          export THEOS="$PWD/theos"
          export PATH="$THEOS/bin:$PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          mkdir -p dist
          # ── rootless（Dopamine / palera1n 主流越狱）──
          # arm64（A11 及更早设备）
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64"
          cp packages/*.deb dist/carsplit-arm64.deb
          # arm64e（A12+ 设备）
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' control
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64e"
          cp packages/*.deb dist/carsplit-arm64e.deb
          git checkout -- control
          # ── rootful（老式 rootful 越狱）──
          gmake clean package FINALPACKAGE=1 ARCHS="arm64"
          cp packages/*.deb dist/carsplit-rootful-arm64.deb
          sed -i '' 's/^Architecture: iphoneos-arm64$/Architecture: iphoneos-arm64e/' control
          gmake clean package FINALPACKAGE=1 ARCHS="arm64e"
          cp packages/*.deb dist/carsplit-rootful-arm64e.deb
          git checkout -- control
          ls -la dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsplit-debs
          path: dist/*.deb

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
